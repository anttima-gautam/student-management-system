<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'students/style.css' %}">
</head>
<body>

    <div class="login-container">
        <h1>Welcome Back!</h1>
        <p>Login to Student Management System</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
